<?xml version="1.0" encoding="UTF-8"?>
<!-- Tate-chu-yoko 縦中横 seal mark — kinari ground, shu seal,
     three Kanji 縦/中/横 stacked vertically in Mincho-flavoured outlines. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="2" fill="#f4ede2"/>
  <rect x="8" y="8" width="48" height="48" rx="1" fill="#c8442f"/>
  <rect x="8" y="8" width="48" height="48" rx="1" fill="none" stroke="#a83626" stroke-width="0.6"/>
  <g fill="#f4ede2" font-family="Shippori Mincho B1, Yu Mincho, serif" font-weight="700" font-size="14" text-anchor="middle">
    <text x="32" y="22">縦</text>
    <text x="32" y="38">中</text>
    <text x="32" y="54">横</text>
  </g>
</svg>
